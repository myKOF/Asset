<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>序章第四鏡・重拾聖光</title>
<style>
 :root{color-scheme:dark;background:#100d0b;color:#eedbc2;font:16px system-ui,sans-serif}
 body{margin:0;min-height:100vh;display:grid;place-items:center}
 main{width:min(100%,1360px)}
 canvas{width:100%;height:auto;display:block;background:#080605}
 .controls{display:flex;gap:1rem;align-items:center;padding:.9rem}
 input{flex:1;accent-color:#d6a064}
 button{background:#3c2a1d;border:1px solid #806344;border-radius:4px;padding:.45rem .9rem;color:inherit}
 output{min-width:5.5ch;text-align:right;font-variant-numeric:tabular-nums}
 .capture main{width:100%}.capture .controls{display:none}
</style>
</head>
<body><main>
<canvas width="1920" height="1080" aria-label="胸前金光鋪滿畫面，切到右手撐地"></canvas>
<div class="controls">
<button disabled>播放</button><input type="range" min="0" step="0.01" value="0" aria-label="播放進度" disabled><output>0.00 s</output>
</div>
</main>
<audio preload="none" src="assets/shot-four-mix.wav"></audio>
<script src="shot-timing.js"></script><script src="brace-effects.js"></script><script src="cloth-motion.js"></script><script src="kneel-orbit.js"></script><script src="rise-matte.js"></script><script src="rise-gust.js"></script><script src="rise-scene.js"></script><script src="shot-cinematics.js"></script><script src="shot.js"></script>
</body>
</html>
